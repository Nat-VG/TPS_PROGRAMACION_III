<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Food Store</title>
  <link rel="stylesheet" href="../auth.css" />
</head>
<body>

  <main class="container">
    <form class="login-form" id="form-login">

      <h1>Food Store</h1>
      <h2>Iniciar Sesión</h2>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="ejemplo@mail.com" />

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required placeholder="********" />

      <button type="submit">Ingresar</button>

      <p class="mensaje-error" id="mensaje-error"></p>

      <p class="registro">
        ¿No tenés cuenta?
        <a href="../registro/registro.html">Registrate acá</a>
      </p>

    </form>
  </main>

  <script type="module" src="./login.ts"></script>
</body>
</html>
