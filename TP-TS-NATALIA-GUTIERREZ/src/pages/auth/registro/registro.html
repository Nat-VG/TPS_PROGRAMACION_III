<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - Food Store</title>
  <link rel="stylesheet" href="../auth.css" />
</head>
<body>

  <main class="container">
    <form class="login-form" id="form-registro">

      <h1>Food Store</h1>
      <h2>Crear Cuenta</h2>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="ejemplo@mail.com" />

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required placeholder="********" />

      <label for="confirm-password">Confirmar Contraseña</label>
      <input type="password" id="confirm-password" name="confirm-password" required placeholder="********" />

      <label for="rol">Rol</label>
      <select id="rol" name="rol" required>
        <option value="">Seleccionar rol...</option>
        <option value="admin">Administrador</option>
        <option value="client">Cliente</option>
      </select>

      <button type="submit">Registrarse</button>

      <p class="mensaje-error" id="mensaje-error"></p>
      <p class="mensaje-exito" id="mensaje-exito"></p>

      <p class="registro">
        ¿Ya tenés cuenta?
        <a href="../login/login.html">Iniciá sesión</a>
      </p>

    </form>
  </main>

  <script type="module" src="./registro.ts"></script>
</body>
</html>
